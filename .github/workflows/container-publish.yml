name: Build and Publish Container to GHCR

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-test-and-push:
    name: Build, Audit & Push OCI Container
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Docker Metadata & OCI Labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Log in to GitHub Container Registry (GHCR)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Container Image with GHA Caching
        id: build-push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
            VCS_REF=${{ github.sha }}
            VERSION=${{ steps.meta.outputs.version || 'latest' }}
            REPO_URL=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: ${{ github.event_name == 'pull_request' }}

      - name: Execute Local Smoke Test & Non-Root Security Verification
        if: github.event_name == 'pull_request'
        run: |
          echo "Starting smoke test container..."
          docker run -d --name smoke-test -p 8501:8501 ${{ steps.meta.outputs.tags[0] }}
          
          echo "Waiting for Streamlit server initialization..."
          sleep 12
          
          echo "Validating non-root runtime context..."
          USER_ID=$(docker exec smoke-test id -u)
          GROUP_ID=$(docker exec smoke-test id -g)
          echo "Detected container UID: $USER_ID, GID: $GROUP_ID"
          if [ "$USER_ID" -ne 1001 ] || [ "$GROUP_ID" -ne 1001 ]; then
            echo "Security assertion failed: Container is running as UID $USER_ID instead of 1001!"
            docker logs smoke-test
            docker rm -f smoke-test
            exit 1
          fi
          
          echo "Testing Streamlit healthcheck endpoint..."
          curl --fail --retry 5 --retry-delay 3 http://localhost:8501/_stcore/health || {
            echo "Healthcheck failed!"
            docker logs smoke-test
            docker rm -f smoke-test
            exit 1
          }
          
          echo "Verifying Playwright browser availability..."
          docker exec smoke-test python -c "
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              b = p.chromium.launch(headless=True)
              print('Headless Chromium successfully verified inside container.')
              b.close()
          "
          
          docker rm -f smoke-test
          echo "All smoke tests and non-root security verifications passed!"
