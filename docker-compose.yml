services:
  retail-command-center:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: retail-command-center-app
    image: retail-command-center:local
    ports:
      - "8501:8501"
    environment:
      # Streamlit Server Hardening & Headless Flags
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1

      # Injected Mock Secrets & API Fallbacks
      - GEMINI_API_KEY=${GEMINI_API_KEY:-mock_gemini_api_key_sandbox_mode}
      - GOOGLE_DOCS_CREDENTIALS=${GOOGLE_DOCS_CREDENTIALS:-mock_docs_oauth_token}
      - MOCK_DATA_FALLBACK=true
      - ENVIRONMENT=local-dev

    # Local development read-only volume mount for UI hot-reloading
    volumes:
      - ./app.py:/app/app.py:ro

    # Production resource limits
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '0.5'
          memory: 1G

    restart: unless-stopped